# ============================================================================
# 数据配置：换一套数据只改这个文件，代码一行不动
#
# 用法:  python build_dataset.py --dataset force2020
# ============================================================================

# ---- 全局参数（各数据集可覆盖）----
window:
  length_m: 2.0      # 窗口长度
  overlap: 0.5       # 相邻窗口重叠比例

target_step_m: 0.125  # 统一重采样步长

# ---- 曲线别名：目标标准名 -> 原始文件里可能的名字（按顺序尝试）----
# 换油田时只需在对应列表里加一个新名字，不要改代码
channels:
  GR:  [GR, GAM, GAPI, CGR, GRD]
  SP:  [SP, SPC, SPONT]
  CAL: [CAL, CALI, CALIPER, HCAL]
  RT:  [RT, ILD, RILD, LLD, RDEEP, RES, LLD_S, RDEP, RMED, RSHA, RXO]
  DEN: [DEN, RHOB, ZDEN, RHOZ]
  CNU: [CNU, CNL, NPHI, TNPH, NPOR]
  AC:  [AC, DT, DTC, SONIC, DTCO]

# 通道缺失时是否允许继续（False 则报错，便于及早发现配置错误）
allow_missing_channels: true
min_channels: 3      # 至少匹配到几条才继续

datasets:

  # ---------------- FORCE 2020 公开真实数据（98 口井，岩性分类）----------------
  force2020:
    task: classification
    target_step_m: 0.15          # 原始采样约 0.15 m，不做 0.125 重采样以免插值造假精度
    paths:
      raw: data/raw/force
      processed: data/processed
    auto_wells:                  # 井太多，按目录扫描而不是手写 98 条
      pattern: "*.csv"
      exclude: ["lith_labels.csv"]
      depth_col: "DEPTH"
    label:
      source: csv
      file: lith_labels.csv
      well_col: 井名
      depth_col: 深度(m)
      value_col: 岩性编码
      unit: code                 # 分类标签，数值即类别码
    units:
      depth: m
